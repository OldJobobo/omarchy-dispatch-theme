# This file is not a full hyprland configuration.
# It is intended to be included in your main hyprland.conf.
$activeBorderColor = rgb(d8c7b0)
$inactiveBorderColor = rgba(8a7b68bb)

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    border_size = 5

}

decoration {
    rounding = 0

    blur {
        enabled = true
        size = 8
        passes = 2
        noise = 0.02
        brightness = 0.85
        xray = false
    }

    shadow {
        enabled = true
        range = 12
        render_power = 2
        color = rgba(25505166)
        color_inactive = rgba(25505133)
    }
}

animations {
    enabled = true

    bezier = dispatch, 0.25, 0.1, 0.25, 1.0

    animation = windows, 1, 3, dispatch, slide
    animation = windowsOut, 1, 2, dispatch, slide
    animation = fade, 1, 3, dispatch
    animation = workspaces, 1, 4, dispatch, slide
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
}



