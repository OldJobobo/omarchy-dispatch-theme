# Minimal current-Omarchy palette.
# This is the smallest practical key set for the current template renderer.
# Omarchy derives bg/fg aliases, semantic accent names, dark/light roles,
# bright_* roles, orange, brown, and theme_type from these values.

# Required semantic keys that are not reliably derived for every template.
background = "#141d23"
foreground = "#b69f80"
accent = "#e6c93a"
cursor = "#e6c93a"
selection_foreground = "#b69f80"
selection_background = "#22343d"

# Required ANSI compatibility keys.
# The current Foot template still references color0..color15 directly.
color0 = "#141d23"
color1 = "#d61f20"
color2 = "#63bba5"
color3 = "#e6c93a"
color4 = "#7c49e0"
color5 = "#c44b8f"
color6 = "#93c5b3"
color7 = "#b69f80"
color8 = "#255051"
color9 = "#de6d40"
color10 = "#7fd0bb"
color11 = "#cdb79c"
color12 = "#a78cff"
color13 = "#f762c2"
color14 = "#2f6667"
color15 = "#d8c7b0"
